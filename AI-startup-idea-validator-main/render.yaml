# Render Blueprint - Deploy both services

services:
  # Backend API
  - type: web
    name: startup-validator-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production

  # Frontend (Static Site)
  - type: web
    name: startup-validator-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://startup-validator-api.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /(?!.*\.).*
        destination: /index.html
